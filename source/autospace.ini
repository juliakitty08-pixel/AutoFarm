; AutoSpace config
; 这个配置文件请按你自己的热键来修改
; 请保持 UTF-8 编码；写回 KeyPressGap 时按 UTF-8 处理
; 修改后按 Toggle 热键重新开启循环即可读取；运行中调整的 KeyPressGap 会在关闭循环时写回这里

[Hotkeys]
; Toggle 连续按空格
Toggle=F9
; 运行中减少按键间隔（按住会连续减少）
GapDecrease=-
; 运行中增加按键间隔（“=”键，按住会连续增加；值就是等号，所以写作 GapIncrease==）
GapIncrease==

[Keys]
; 连续按下的按键，默认空格
Key=Space

[Timing]
; 每次按键之间的等待间隔，单位毫秒；两次按键之间会等待这么久
; 最小 10；配置文件中写小于 10 的值会回落到默认 200
KeyPressGap=200
; 每次按 GapDecrease / GapIncrease 调整的步进值，单位毫秒
Adjustment=10
; 按键按下时长，单位毫秒；一般不用改
TapMs=60
